name: Deploy to Cloudflare Pages

# Uploads dist to the existing Pages project agentic-dataset-hub.
# Production stays at https://agentic-dataset-hub.pages.dev.
# Does not create a Pages project, change DNS, or run for pull requests,
# so Cloudflare secrets are never exposed to untrusted pull request code.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One production publish at a time. A newer main push cancels an in-progress
# deploy so an older build cannot be published after a newer one.
concurrency:
  group: cloudflare-pages-agentic-dataset-hub-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-branch:
    name: Confirm production branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys are limited to refs/heads/main."
          echo "Selected ref: ${GITHUB_REF}"
          exit 1

  deploy:
    name: Test, build, and deploy
    needs: production-branch
    if: github.ref == 'refs/heads/main' && github.repository == 'mohamedahmedhimdan/agentic-dataset-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to existing Cloudflare Pages project
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: pages deploy dist --project-name=agentic-dataset-hub --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Write deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          PAGES_ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
        run: |
          {
            echo "### Cloudflare Pages"
            echo "- Project: \`agentic-dataset-hub\`"
            echo "- Branch: \`main\`"
            echo "- Environment: \`${PAGES_ENVIRONMENT:-unknown}\`"
            echo "- Deployment URL: ${DEPLOYMENT_URL:-unavailable}"
            echo "- Alias URL: ${ALIAS_URL:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"
